<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="popover" id="popover">
    <div class="title-bar" id="titleBar">
      <span class="title-text" id="titleText">~ claude code ~</span>
      <button class="copy-btn" id="copyBtn" title="Copy last response">
        <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
          <path d="M0 6.75C0 5.784.784 5 1.75 5h1.5a.75.75 0 010 1.5h-1.5a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-1.5a.75.75 0 011.5 0v1.5A1.75 1.75 0 019.25 16h-7.5A1.75 1.75 0 010 14.25v-7.5z"/>
          <path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0114.25 11h-7.5A1.75 1.75 0 015 9.25v-7.5zm1.75-.25a.25.25 0 00-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 00.25-.25v-7.5a.25.25 0 00-.25-.25h-7.5z"/>
        </svg>
      </button>
    </div>
    <div class="separator"></div>
    <div class="terminal" id="terminal">
      <div class="messages" id="messages"></div>
    </div>
    <div class="input-area">
      <div class="input-row">
        <input type="text" class="input-field" id="inputField" placeholder="ask claude anything..." autocomplete="off" spellcheck="false">
        <button class="mic-btn" id="micBtn" title="Voice input (click to record)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="markdown.js"></script>
  <script src="voice-input.js"></script>
  <script src="chat.js"></script>
</body>
</html>
